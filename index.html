<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400;1,700&family=Gorditas:wght@400;700&family=Micro+5&family=VT323&display=swap" rel="stylesheet">
    <title>Book Helper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-header">
        <div class="title-row">
            <h1>Book Helper</h1>
            <div class="mascot-wrapper">
                <div class="mascot-body"></div>
                <div class="mascot-details"></div>
            </div>
        </div>
        <p class="subtitle">Stay on track, minimize distractions, grow your mind.</p>
    </div>

    <div class="page">
        <div class="timer-card">
            <h2>Timer</h2>
            <div class="timer-display" id="timer">15:00</div>
            <div class="controls">
                <button id="start-btn" onclick="toggleTimer()">Start Reading!</button>
                <button id="reset-btn" onclick="resetTimer()">Reset</button>
            </div>

            <div class="level-panel">
                <div class="level-row">
                    <span class="level-badge">
                        Lv <span id="level-count">1</span>
                    </span>
                    <span class="level-title" id="level-title">Page Turner</span>
                </div>
                <div class="xp-bar-track">
                    <div class="xp-bar-fill" id="xp-bar-fill" style="width: 0%;"></div>
                </div>
                <div class="xp-bar-label" id="xp-bar-label">0 / 100 XP to next level</div>
            </div>
        </div>

        <div class="side-column">
            <div class="container ambient-container">
                <h2>Ambient Noise</h2>
                <audio id="rain-audio" loop src="sounds/rain.mp3"></audio>
                <div class="ambient-section">
                    <div class="sound-row">
                        <p>White Noise</p>
                        <button id="white-btn" class="toggle-switch" onclick="toggleAmbient()">Play Sound</button>
                    </div>
                    <div class="sound-row">
                        <p>Heavy Rain</p>
                        <button id="rain-btn" class="toggle-switch" onclick="togglePlayback()">Play Sound</button>
                    </div>
                </div>
            </div>

            <div class="container stats-container">
                <h2>Stats</h2>
                <div class="stats-strip">
                    <div class="stats-strip-item">
                        <span class="stats-strip-value" id="streak-count">0</span>
                        <span class="stats-strip-label">Streak</span>
                    </div>
                    <div class="stats-strip-item">
                        <span class="stats-strip-value" id="xp-count">0</span>
                        <span class="stats-strip-label">Total XP</span>
                    </div>
                    <div class="stats-strip-item">
                        <span class="stats-strip-value" id="sessions-count">0</span>
                        <span class="stats-strip-label">Sessions</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="navbar">
            <button class="link-btn link-btn-trophies" onclick="openModal('trophies-modal')">Trophies</button>
            <button class="link-btn link-btn-customize" onclick="openModal('customize-modal')">Customize</button>
            <button class="link-btn link-btn-settings" onclick="openModal('settings-modal')">Settings</button>
        </div>
    </div>

    <div class="modal-overlay" id="trophies-modal" onclick="closeModalOnBackdrop(event, 'trophies-modal')">
        <div class="modal">
            <button class="modal-close" onclick="closeModal('trophies-modal')" aria-label="Close">&times;</button>
            <h2>Trophies</h2>
            <div class="badge-grid" id="badge-grid"></div>
        </div>
    </div>

    <div class="modal-overlay" id="customize-modal" onclick="closeModalOnBackdrop(event, 'customize-modal')">
        <div class="modal">
            <button class="modal-close" onclick="closeModal('customize-modal')" aria-label="Close">&times;</button>
            <h2>Customize</h2>
            <div class="theme-grid" id="theme-grid"></div>
        </div>
    </div>

    <div class="modal-overlay" id="settings-modal" onclick="closeModalOnBackdrop(event, 'settings-modal')">
        <div class="modal">
            <button class="modal-close" onclick="closeModal('settings-modal')" aria-label="Close">&times;</button>
            <h2>Settings</h2>
            <div class="settings-section">
                <label for="timer-duration">Timer Duration (minutes):</label>
                <input type="number" id="timer-duration" min="1" max="120" value="15">
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="complete-modal" onclick="closeModalOnBackdrop(event, 'complete-modal')">
        <div class="modal complete-modal">
            <button class="modal-close" onclick="closeModal('complete-modal')" aria-label="Close">&times;</button>
            <div class="complete-icon">📖</div>
            <h2>Reading Complete!</h2>
            <div class="complete-body" id="complete-body"></div>
            <button class="complete-ok-btn" onclick="closeModal('complete-modal')">Nice!</button>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
