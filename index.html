<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400;1,700&family=Gorditas:wght@400;700&display=swap" rel="stylesheet">
    <title>book helper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <h1>Book Helper</h1>
        <p class="subtitle">Stay on track, minimize distractions, grow your mind.</p>
    </div>

    <div class="layout-row">
        <div class="left-column">
            <div class="container-left">
                <h1>Timer</h1>
                <div class="timer-display" id="timer">15:00</div>
                <div class="controls">
                    <button id="start-btn" onclick="toggleTimer()">Start Reading!</button>
                    <button id="reset-btn" onclick="resetTimer()">Reset</button>
                </div>
            </div>

            <div class="container">
                <h1>Stats</h1>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-value" id="streak-count">0</div>
                        <div class="stat-label">Current Streak</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="xp-count">0</div>
                        <div class="stat-label">Total XP</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="container-right">
            <h1>Ambient Noise</h1>
            <div class="ambient-section">
                <p>White Focus Noise<p>
                <button id="ambient-btn" class="toggle-switch" onclick="toggleAmbient()">Play Sound</button>
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
